name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-test:
    name: Validate, Test & Package
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pywin32

      - name: Validate 7-bit ASCII Source Code Safety
        shell: powershell
        run: |
          Write-Host "Verifying that all .bas and .frm source files are strictly 7-bit ASCII safe..."
          $violations = @()
          Get-ChildItem -Path src -Include *.bas,*.frm -Recurse | ForEach-Object {
              $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
              $nonAsciiCount = ($bytes | Where-Object { $_ -gt 127 }).Count
              if ($nonAsciiCount -gt 0) {
                  $violations += "$($_.FullName): $nonAsciiCount non-ASCII byte(s)"
              }
          }
          if ($violations.Count -gt 0) {
              Write-Error "ASCII Safety violation detected:`n$($violations -join "`n")"
              exit 1
          }
          Write-Host "[OK] All VBA components are 100% 7-bit ASCII safe." -ForegroundColor Green

      - name: Validate Ribbon XML Syntax
        shell: powershell
        run: |
          Write-Host "Validating ribbon/customUI14.xml schema syntax..."
          [xml]$xml = Get-Content ribbon/customUI14.xml -Raw -Encoding UTF8
          if (-not $xml.customUI) {
              Write-Error "Invalid customUI root element in ribbon/customUI14.xml"
              exit 1
          }
          Write-Host "[OK] Ribbon XML syntax is valid." -ForegroundColor Green

      - name: Run Offline Test Suite
        shell: powershell
        run: |
          python tests/run_offline_tests.py

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bwpconvert-ttnvn-dist
          path: |
            dist/*.xlam
            dist/*.zip
            dist/*.sha256
          if-no-files-found: warn

  create-release:
    name: GitHub Release
    needs: validate-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: bwpconvert-ttnvn-dist
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
            dist/*.xlam
          generate_release_notes: true
